<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DON XR · 짱짱이 WebAR 데모</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<script src="chat.js"></script>
<style>
  :root{ --pink:#ff5aa7; --ink:#1b1330 }
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0}
  #bg{position:absolute;inset:0;z-index:0;
    background:radial-gradient(120% 120% at 50% 0%,#ffe6f3 0%,#e9e2ff 45%,#dbeeff 100%)}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;background:#000}
  model-viewer{position:absolute;inset:0;z-index:1;width:100%;height:100%;background:transparent;--poster-color:transparent}
  body.live #bg{display:none}
  body.live #cam{display:block}
  /* 상단 */
  .top{position:absolute;top:0;left:0;right:0;z-index:2;text-align:center;padding:14px 16px 6px;
    background:linear-gradient(#ffffffcc,transparent)}
  body.live .top{background:linear-gradient(#000000aa,transparent);color:#fff}
  .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:#fff;
    background:var(--pink);padding:3px 11px;border-radius:999px}
  .top h1{margin:8px 0 2px;font-size:18px} .top p{margin:0;font-size:12px;color:#6b5f86}
  body.live .top p{color:#eee}
  /* 하단 버튼 */
  .bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    background:linear-gradient(transparent,#ffffffcc)}
  body.live .bottom{background:linear-gradient(transparent,#000000aa)}
  button{appearance:none;border:0;cursor:pointer;font-weight:800;font-size:15px;color:#fff;border-radius:14px;padding:13px 20px}
  .live-btn{background:linear-gradient(135deg,#ff5aa7,#a06bff);box-shadow:0 8px 22px rgba(160,107,255,.35)}
  .ar-btn{background:#2b2350}
  .close-btn{background:#e0466e;display:none}
  body.live .close-btn{display:inline-block}
  body.live .live-btn{display:none}
  .hint{position:absolute;left:0;right:0;bottom:84px;z-index:2;text-align:center;font-size:12px;color:#6b5f86;padding:0 20px}
  body.live .hint{color:#fff;text-shadow:0 1px 3px #000}
  .badge{position:absolute;top:12px;right:12px;z-index:2;font-size:10px;color:#8a7fae}
  body.live .badge{color:#ddd}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <video id="cam" playsinline autoplay muted></video>

  <model-viewer id="mv"
    src="jangjang.glb" ios-src="jangjang.usdz" alt="짱짱이 3D"
    ar ar-modes="scene-viewer webxr quick-look" ar-scale="auto"
    camera-controls touch-action="none" auto-rotate rotation-per-second="16deg"
    shadow-intensity="1" exposure="1.05" environment-image="neutral">
  </model-viewer>

  <span class="badge">AI 생성 3D · 심사용 데모</span>
  <div class="top">
    <span class="tag">DON XR 어드벤처</span>
    <h1>짱짱이와 만나기 · WebAR</h1>
    <p>KBS 애니메이션 「돈(DON)」 · 앱 없이 폰 브라우저로</p>
  </div>

  <p class="hint" id="hint">손가락으로 <b>돌려보고 확대</b>하세요. 가까이 <b>확대하면 짱짱이가 먼저 말을 걸어요!</b></p>

  <div class="bottom">
    <button class="live-btn" id="liveBtn">📷 라이브 카메라에 짱짱이 띄우기</button>
    <button class="mic-btn" id="micBtn">🎤 말 걸기</button>
    <button class="ar-btn" id="arBtn">🧭 바닥에 배치 (공간 AR)</button>
    <button class="ar-btn" id="inpageBtn" style="background:#3a2f66">✨ 인페이지 AR + 대화 (전 기기)</button>
    <button class="close-btn" id="closeBtn">✕ 카메라 끄기</button>
  </div>
</div>

<script>
  const mv=document.getElementById('mv');
  const cam=document.getElementById('cam');
  const hint=document.getElementById('hint');
  let stream=null;

  // ① 인페이지 라이브 카메라 합성 (짱짱이가 카메라 위에)
  document.getElementById('liveBtn').addEventListener('click', async ()=>{
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      cam.srcObject=stream; await cam.play().catch(()=>{});
      document.body.classList.add('live');
      mv.autoRotate=false; mv.exposure=1.2;
      hint.innerHTML='실제 화면 위에 <b>짱짱이</b>가 떴어요! 손가락으로 돌리고 확대·이동해 보세요.';
    }catch(e){ alert('카메라 권한이 필요해요.\n브라우저에서 카메라 허용을 눌러주세요.\n('+e.name+')'); }
  });

  // 카메라 끄기
  document.getElementById('closeBtn').addEventListener('click', ()=>{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    cam.srcObject=null; document.body.classList.remove('live');
    mv.autoRotate=true; mv.exposure=1.05;
    hint.innerHTML='손가락으로 <b>돌려보고 확대</b>하세요.';
  });

  // ② OS 공간 AR (바닥 인식 - Scene Viewer/Quick Look)
  document.getElementById('arBtn').addEventListener('click', ()=>{
    if(mv.canActivateAR) mv.activateAR();
    else alert('이 기기는 공간 AR(바닥 배치)이 제한돼요. 대신 "📷 라이브 카메라"를 눌러보세요!');
  });

  // ②-2 인페이지 AR 기기 자동분기
  //   안드로이드: WebXR 네이티브(가벼움, 추가 다운로드 없음)
  //   아이폰 등:  8th Wall CV/SLAM 엔진(iOS Safari는 WebXR 미지원)
  document.getElementById('inpageBtn').addEventListener('click', async ()=>{
    let hasWebXR=false;
    try{ hasWebXR = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); }catch(e){}
    location.href = hasWebXR ? 'webxr.html' : 'xr8.html';
  });

  // ③ 대화 — 근접 트리거 + 음성 인식(온디바이스)
  const chatUI = DonChat.mount();
  const micBtn = document.getElementById('micBtn');
  DonChat.setMic(micBtn);
  micBtn.addEventListener('click', ()=>{ DonChat.open(); DonChat.listen(); });

  // 근접 판정 = 짱짱이에게 가까이 다가가면(확대) 먼저 말을 건다
  // ⚠️ 모델 로드 전 getCameraOrbit()은 기본값(-2.2)이라 그대로 쓰면 즉시 오발동
  //    → 로드 후 '기준 거리'를 잡고 그 비율로 판정 + 사용자 조작 후에만 무장(오디오 정책)
  let baseR = 0, armed = false, nearOnce = false;
  ['pointerdown','touchstart','click'].forEach(ev=>
    addEventListener(ev, ()=>{ armed = true; }, {once:true, passive:true}));

  mv.addEventListener('camera-change', ()=>{
    const r = mv.getCameraOrbit().radius;
    if(r <= 0) return;                       // 로드 전 기본값(-2.2) 무시
    if(baseR <= 0){ baseR = r; return; }      // 첫 유효값 = 기준 거리
    if(!armed) return;                        // 사용자 조작 후에만 (오디오 정책)
    if(r < baseR*0.55 && !nearOnce){ nearOnce=true; DonChat.proximity(true); }   // 가까이 → 인사
    else if(r > baseR*0.85 && nearOnce){ nearOnce=false; DonChat.resetProximity(); } // 멀어지면 재무장
  });
</script>
</body>
</html>
