<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DON XR · 짱짱이 WebAR 데모</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root{ --pink:#ff5aa7; --ink:#1b1330; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#ffe6f3 0%,#e9e2ff 45%,#dbeeff 100%);
    color:var(--ink); display:flex; flex-direction:column; min-height:100dvh}
  header{padding:18px 20px 6px; text-align:center}
  header .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;
    color:#fff;background:var(--pink);padding:4px 12px;border-radius:999px}
  header h1{margin:10px 0 2px;font-size:20px}
  header p{margin:0;font-size:13px;color:#6b5f86}
  model-viewer{flex:1;width:100%;min-height:56vh;background:transparent;--poster-color:transparent}
  .hint{max-width:520px;margin:0 auto;padding:8px 20px 4px;font-size:13px;color:#6b5f86;text-align:center}
  .btnbar{padding:6px 16px 22px;display:flex;justify-content:center}
  .ar{appearance:none;border:0;cursor:pointer;font-weight:800;font-size:16px;color:#fff;
    background:linear-gradient(135deg,#ff5aa7,#a06bff);padding:14px 26px;border-radius:14px;
    box-shadow:0 8px 22px rgba(160,107,255,.35)}
  .foot{font-size:11px;color:#9a8fb5;text-align:center;padding-bottom:16px}
  .badge{position:absolute;top:12px;right:12px;font-size:11px;color:#8a7fae}
</style>
</head>
<body>
  <span class="badge">AI 생성 3D · 심사용 데모</span>
  <header>
    <span class="tag">DON XR 어드벤처</span>
    <h1>짱짱이와 만나기 · WebAR</h1>
    <p>KBS 애니메이션 「돈(DON)」 · 앱 없이 폰 브라우저로</p>
  </header>

  <model-viewer
    src="jangjang.glb"
    ios-src="jangjang.usdz"
    alt="짱짱이 3D"
    ar ar-modes="scene-viewer webxr quick-look" ar-scale="auto"
    camera-controls touch-action="pan-y" auto-rotate rotation-per-second="18deg"
    shadow-intensity="1" exposure="1.05" environment-image="neutral"
    poster-color="transparent">
    <button slot="ar-button" class="ar">📱 내 공간에 짱짱이 소환하기</button>
  </model-viewer>

  <p class="hint">손가락으로 <b>돌려보고 확대</b>하세요. 아래 버튼을 누르면 <b>카메라 라이브 화면</b>에 짱짱이가 나타나요.</p>
  <div class="btnbar"></div>
  <p class="foot">라라스튜디오 · WebAR 개념 데모 (아이폰·안드로이드 모두 AR 지원)</p>

<script>
  // AR 미지원 기기 안내
  const mv=document.querySelector('model-viewer');
  mv.addEventListener('ar-status',e=>{ if(e.detail.status==='failed') alert('이 기기/브라우저는 AR 실행이 제한돼요. 3D는 그대로 돌려볼 수 있어요!'); });
</script>
</body>
</html>
