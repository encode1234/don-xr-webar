<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>짱짱이 · 인페이지 WebXR (안드로이드)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0b12;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif}
  #info{position:fixed;top:0;left:0;right:0;z-index:5;text-align:center;padding:12px;font-size:13px;
    background:linear-gradient(#000000cc,transparent);pointer-events:none}
  #info b{color:#ff8ec4}
  #note{position:fixed;bottom:80px;left:0;right:0;z-index:5;text-align:center;font-size:12px;color:#cbb8e0;padding:0 20px;pointer-events:none}
  a.back{position:fixed;top:10px;left:10px;z-index:6;color:#fff;background:#0008;border-radius:10px;padding:8px 12px;font-size:13px;text-decoration:none}
  #micBtn{position:fixed;right:12px;bottom:150px;z-index:7;display:none;border:0;border-radius:14px;
    padding:12px 16px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,#00b894,#0984e3)}
  body.placed #micBtn{display:block}
  #micBtn.on{background:#e0466e}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<a class="back" href="index.html">← 뒤로</a>
<div id="info"><b>짱짱이</b> 인페이지 WebXR · 바닥을 비추고 <b>화면을 탭</b>하면 그 자리에 고정돼요 (걸어서 돌아보기)</div>
<div id="note">※ 안드로이드 Chrome(ARCore) 전용 · 아이폰(사파리)은 미지원 → 아이폰은 앞 페이지의 "바닥에 배치" 사용<br>배치 후 <b>가까이 다가가면 짱짱이가 먼저 말을 걸어요</b></div>
<button id="micBtn">🎤 말 걸기</button>
<script src="chat.js"></script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let renderer, scene, camera, reticle, model, hitTestSource=null, localSpace=null, placed=false;

init();

function init(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 40);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4));
  const dir = new THREE.DirectionalLight(0xffffff, 1.6); dir.position.set(1,3,2); scene.add(dir);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  document.body.appendChild(ARButton.createButton(renderer, {
    requiredFeatures:['hit-test'],
    optionalFeatures:['dom-overlay'],
    domOverlay:{ root: document.body }
  }));

  // 조준 링(레티클)
  const ring = new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(ring, new THREE.MeshBasicMaterial({color:0xff5aa7}));
  reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

  // 짱짱이 로드
  new GLTFLoader().load('jangjang.glb', g=>{ model=g.scene; });

  // 탭 → 배치
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', ()=>{
    if(reticle.visible && model){
      const m = placed ? model : model; // 단일 인스턴스 이동
      if(!placed){ scene.add(model); placed=true; }
      model.position.setFromMatrixPosition(reticle.matrix);
      model.quaternion.setFromRotationMatrix(reticle.matrix);
      model.visible=true;
      document.body.classList.add('placed');
      DonChat.open(); DonChat.resetProximity();   // 배치 직후부터 근접 감지
    }
  });
  scene.add(controller);

  renderer.xr.addEventListener('sessionstart', async ()=>{
    const session = renderer.xr.getSession();
    const viewer = await session.requestReferenceSpace('viewer');
    hitTestSource = await session.requestHitTestSource({ space: viewer });
    localSpace = await session.requestReferenceSpace('local');
    session.addEventListener('end', ()=>{ hitTestSource=null; placed=false; if(model) model.visible=false; });
  });

  // 대화 UI
  DonChat.mount();
  const micBtn = document.getElementById('micBtn');
  DonChat.setMic(micBtn);
  micBtn.addEventListener('click', ()=>{ DonChat.open(); DonChat.listen(); });

  renderer.setAnimationLoop(render);
  addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
}

const _camPos = new THREE.Vector3();

function render(t, frame){
  if(frame && hitTestSource && localSpace && !placed){
    const hits = frame.getHitTestResults(hitTestSource);
    if(hits.length){
      const pose = hits[0].getPose(localSpace);
      reticle.visible=true; reticle.matrix.fromArray(pose.transform.matrix);
    } else reticle.visible=false;
  }

  // 근접 트리거 — 관람객이 1.2m 안으로 다가오면 짱짱이가 먼저 말을 건다
  if(placed && model){
    renderer.xr.getCamera().getWorldPosition(_camPos);
    const d = _camPos.distanceTo(model.position);
    DonChat.proximity(d < 1.2);
    if(d > 2.0) DonChat.resetProximity();          // 멀어지면 다시 인사 가능
    model.lookAt(_camPos.x, model.position.y, _camPos.z);  // 관람객 쪽 바라보기
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
